<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Persona cosechando algodón</title>
  <defs>
    <linearGradient id="mancha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9c2"/><stop offset=".55" stop-color="#f7bd6a"/><stop offset="1" stop-color="#e58a2e"/>
    </linearGradient>
    <g id="mota">
      <circle cx="0" cy="-5" r="6.5" fill="#fff"/><circle cx="-6" cy="0" r="6" fill="#fff"/><circle cx="6" cy="0" r="6" fill="#fff"/>
      <circle cx="-3" cy="4.5" r="5.5" fill="#fbf6ef"/><circle cx="3" cy="4.5" r="5.5" fill="#fbf6ef"/>
    </g>
    <g id="capsula">
      <path d="M-9 4 L-3 11 L0 6 L3 11 L9 4 L4 7 L0 1 L-4 7 Z" fill="#7a4126"/>
      <use href="#mota"/>
    </g>
  </defs>
  <style>
    .brazo { transform-origin: 192px 140px; animation: cosechar 3.6s ease-in-out infinite; }
    .en-mano { animation: llevar 3.6s linear infinite; }
    .en-planta { animation: crecer 3.6s linear infinite; }
    .cabeza { transform-origin: 196px 120px; animation: mirar 3.6s ease-in-out infinite; }
    .planta { transform-box: fill-box; transform-origin: 50% 100%; animation: mecer 4s ease-in-out infinite alternate; }
    .planta.b { animation-duration: 5s; animation-delay: -1.3s; }
    .planta.c { animation-duration: 4.6s; animation-delay: -2.4s; }
    .pila { transform-origin: 160px 212px; animation: pila 3.6s ease-in-out infinite; }
    .ave { animation: volar 14s linear infinite; }
    @keyframes cosechar {
      0%, 14% { transform: rotate(171deg); }
      48%, 58% { transform: rotate(114deg); }
      92%, 100% { transform: rotate(171deg); }
    }
    @keyframes llevar { 0%, 9% { opacity: 0; } 10%, 52% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes crecer { 0%, 9% { opacity: 1; } 10%, 88% { opacity: 0; } 96%, 100% { opacity: 1; } }
    @keyframes mirar { 0%, 14% { transform: rotate(-4deg); } 48%, 58% { transform: rotate(6deg); } 92%, 100% { transform: rotate(-4deg); } }
    @keyframes mecer { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
    @keyframes pila { 0%, 52% { transform: scale(1); } 56% { transform: scale(1.08); } 64%, 100% { transform: scale(1); } }
    @keyframes volar { from { transform: translate(-60px, 0); } to { transform: translate(470px, -30px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .en-mano { opacity: 0; } }
  </style>

  <path d="M64 70 C110 22 214 18 290 40 C356 60 388 118 372 176 C356 236 300 268 214 270 C128 272 48 250 30 196 C14 146 30 104 64 70 Z" fill="url(#mancha)"/>
  <circle cx="300" cy="86" r="22" fill="#fff3d6" opacity=".85"/>
  <g class="ave" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M40 60 q6 -6 12 0 q6 -6 12 0"/><path d="M70 48 q4 -4 8 0 q4 -4 8 0"/>
  </g>

  <!-- plantas del fondo -->
  <g class="planta b">
    <path d="M300 250 C298 220 302 196 296 172 M298 214 C312 204 318 196 322 186 M298 200 C288 192 282 184 280 172" stroke="#6a3a22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M296 220 c-16 -4 -24 4 -26 10 c10 4 20 2 26 -10z M300 206 c14 -8 24 -4 28 2 c-8 6 -20 6 -28 -2z" fill="#3f7a43"/>
    <use href="#capsula" x="296" y="166"/><use href="#capsula" x="323" y="180"/><use href="#capsula" x="279" y="166"/>
  </g>

  <!-- persona -->
  <g>
    <!-- brazo de atrás sosteniendo el costal -->
    <path d="M214 146 C228 164 236 178 240 196" stroke="#d9d9d9" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="241" cy="200" r="7.5" fill="#b9784d"/>
    <!-- cuerpo -->
    <path d="M178 140 C182 130 196 126 210 128 C222 130 228 140 228 152 L232 236 L172 236 L176 160 Z" fill="#E5E5E5"/>
    <path d="M178 176 L230 176 L232 236 L226 258 L208 258 L203 232 L198 258 L178 258 L172 236 Z" fill="#14213D"/>
    <path d="M174 256 h26 v6 h-30 z M206 256 h22 l4 6 h-26 z" fill="#5a341c"/>
    <path d="M186 176 L190 136 M222 176 L216 136" stroke="#14213D" stroke-width="6" stroke-linecap="round"/>
    <rect x="194" y="186" width="18" height="14" rx="3" fill="#22345c"/>
    <!-- cabeza -->
    <g class="cabeza">
      <rect x="190" y="112" width="12" height="16" rx="5" fill="#b9784d"/>
      <circle cx="196" cy="104" r="16" fill="#c98a5c"/>
      <path d="M182 108 c4 10 22 12 28 2" fill="#e8e8e8"/>
      <circle cx="189" cy="102" r="1.8" fill="#14213D"/>
      <path d="M184 109 q4 3 8 0" stroke="#7a4a2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="198" cy="91" rx="36" ry="8" fill="#FCA311"/>
      <path d="M180 90 C180 74 190 68 199 68 C210 68 217 76 216 90 Z" fill="#f6b43a"/>
      <path d="M181 86 L216 86" stroke="#14213D" stroke-width="4"/>
    </g>
  </g>

  <!-- canasto -->
  <g>
    <g class="pila">
      <use href="#mota" x="148" y="208"/><use href="#mota" x="164" y="204"/><use href="#mota" x="178" y="210"/><use href="#mota" x="157" y="198"/>
    </g>
    <path d="M132 212 L192 212 L184 252 L140 252 Z" fill="#a8683c"/>
    <path d="M136 224 L189 224 M138 236 L187 236 M140 246 L185 246" stroke="#7c4524" stroke-width="2.5"/>
    <path d="M148 212 L152 252 M162 212 L162 252 M176 212 L172 252" stroke="#8c5430" stroke-width="2"/>
    <rect x="128" y="207" width="68" height="8" rx="4" fill="#7c4524"/>
  </g>

  <!-- planta donde cosecha -->
  <g class="planta">
    <path d="M110 256 C112 226 116 196 122 160 M116 214 C102 204 96 194 92 182 M118 194 C130 186 138 176 140 166" stroke="#6a3a22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M114 226 c-18 -6 -28 2 -30 10 c12 6 24 2 30 -10z M118 206 c16 -10 28 -6 32 2 c-10 8 -24 8 -32 -2z M120 178 c-14 -8 -24 -4 -28 2 c8 6 20 6 28 -2z" fill="#3f7a43"/>
    <use href="#capsula" x="92" y="176"/><use href="#capsula" x="141" y="160"/>
    <g class="en-planta"><use href="#capsula" x="123" y="151"/></g>
  </g>

  <!-- brazo que cosecha (gira desde el hombro) -->
  <g class="brazo">
    <path d="M192 140 L236 140" stroke="#E5E5E5" stroke-width="15" stroke-linecap="round"/>
    <path d="M232 140 L254 140" stroke="#c98a5c" stroke-width="11" stroke-linecap="round"/>
    <circle cx="260" cy="140" r="7.5" fill="#c98a5c"/>
    <g class="en-mano"><use href="#mota" x="264" y="140"/></g>
  </g>

  <!-- plantas del frente -->
  <g class="planta c">
    <path d="M240 262 C242 240 240 226 246 208 M242 236 C254 230 262 222 264 212" stroke="#6a3a22" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M240 244 c-16 -6 -26 0 -28 8 c10 6 22 4 28 -8z M244 228 c14 -8 24 -4 28 2 c-8 6 -20 6 -28 -2z" fill="#4a8a4c"/>
    <use href="#capsula" x="246" y="202"/><use href="#capsula" x="265" y="206"/>
  </g>
  <path d="M40 262 C120 252 280 252 362 262 L360 272 C280 280 120 280 42 272 Z" fill="#c9762f" opacity=".55"/>
</svg>
